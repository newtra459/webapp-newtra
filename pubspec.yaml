name: mjollnir_app
description: "Newtra - Smart Mobility Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3
  fl_chart: ^0.69.2
  syncfusion_flutter_gauges: ^27.2.5

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Maps & Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Camera & QR
  mobile_scanner: ^7.2.0
  image_picker: ^1.1.2

  # Storage & Auth
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4

  # Network
  dio: ^5.7.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  share_plus: ^10.1.4
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  freezed_annotation: ^2.4.4
  connectivity_plus: ^6.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo/app_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#0D1412"
  adaptive_icon_foreground: "assets/images/logo/icon_mark_white_green.png"
  web:
    generate: true
    image_path: "assets/images/logo/app_icon.png"
    background_color: "#0D1412"
    theme_color: "#0D1412"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo/
    - assets/icons/
    - assets/animations/
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
